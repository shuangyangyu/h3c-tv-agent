# MQTT Switch 示例（并行观察用；确认 Agent 稳定后再考虑下线旧集成）
# 放到 HA：/config/packages/h3c_tv_mqtt.yaml 并确保 packages 已启用

mqtt:
  switch:
    - name: "主卧电视上网 (MQTT)"
      unique_id: h3c_tv_mqtt_master_bedroom
      state_topic: "h3c/tv/master_bedroom/state"
      command_topic: "h3c/tv/master_bedroom/set"
      payload_on: "ON"
      payload_off: "OFF"
      state_on: "ON"
      state_off: "OFF"
      availability_topic: "h3c/tv/status"
      payload_available: "online"
      payload_not_available: "offline"
      qos: 1

    - name: "客厅电视上网 (MQTT)"
      unique_id: h3c_tv_mqtt_living_room
      state_topic: "h3c/tv/living_room/state"
      command_topic: "h3c/tv/living_room/set"
      payload_on: "ON"
      payload_off: "OFF"
      state_on: "ON"
      state_off: "OFF"
      availability_topic: "h3c/tv/status"
      payload_available: "online"
      payload_not_available: "offline"
      qos: 1

    - name: "老人房电视上网 (MQTT)"
      unique_id: h3c_tv_mqtt_elder_room
      state_topic: "h3c/tv/elder_room/state"
      command_topic: "h3c/tv/elder_room/set"
      payload_on: "ON"
      payload_off: "OFF"
      state_on: "ON"
      state_off: "OFF"
      availability_topic: "h3c/tv/status"
      payload_available: "online"
      payload_not_available: "offline"
      qos: 1

    - name: "书房电视上网 (MQTT)"
      unique_id: h3c_tv_mqtt_study_room
      state_topic: "h3c/tv/study_room/state"
      command_topic: "h3c/tv/study_room/set"
      payload_on: "ON"
      payload_off: "OFF"
      state_on: "ON"
      state_off: "OFF"
      availability_topic: "h3c/tv/status"
      payload_available: "online"
      payload_not_available: "offline"
      qos: 1
