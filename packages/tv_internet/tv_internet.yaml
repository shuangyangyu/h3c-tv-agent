# Sony 电视上网控制
# 说明：
# - 打开开关 = 允许对应电视上网
# - 关闭开关 = 禁止对应电视上网
# - 实际控制逻辑在 /config/scripts/tv_internet/tv_internet_control.py
# - enable  会删除交换机 ACL 中对应电视的 deny 规则
# - disable 会恢复交换机 ACL 中对应电视的 deny 规则
# - 当前使用主动刷新 + 保底轮询真实 ACL 状态：
#   点击开关后等待 5 秒主动刷新 sensor，平时每 60 秒自动查询一次交换机
# - template switch 负责显示滑动开关，shell_command 负责执行开关命令
# - 不依赖交换机 RTM/EAA 或 webhook 反馈
# - 如需恢复 webhook/input_boolean 反馈，可参考备份文件 tv_internet.yaml.feedback.bak

command_line:
  # 一次 Telnet 查询四台电视真实状态，避免每个开关各查一次交换机。
  - sensor:
      name: Sony TV Internet Status
      unique_id: sony_tv_internet_status
      command: "python3 /config/scripts/tv_internet/tv_internet_control.py status-json"
      command_timeout: 30
      scan_interval: 60
      value_template: "{{ now().isoformat() }}"
      json_attributes:
        - master_bedroom
        - living_room
        - elder_room
        - study_room

shell_command:
  sony_tv_master_bedroom_internet_on: "python3 /config/scripts/tv_internet/tv_internet_control.py enable master_bedroom"
  sony_tv_master_bedroom_internet_off: "python3 /config/scripts/tv_internet/tv_internet_control.py disable master_bedroom"

  sony_tv_living_room_internet_on: "python3 /config/scripts/tv_internet/tv_internet_control.py enable living_room"
  sony_tv_living_room_internet_off: "python3 /config/scripts/tv_internet/tv_internet_control.py disable living_room"

  sony_tv_elder_room_internet_on: "python3 /config/scripts/tv_internet/tv_internet_control.py enable elder_room"
  sony_tv_elder_room_internet_off: "python3 /config/scripts/tv_internet/tv_internet_control.py disable elder_room"

  sony_tv_study_room_internet_on: "python3 /config/scripts/tv_internet/tv_internet_control.py enable study_room"
  sony_tv_study_room_internet_off: "python3 /config/scripts/tv_internet/tv_internet_control.py disable study_room"

template:
  - switch:
      # 主卧室 Sony 电视
      # IP: 192.168.1.24
      # MAC: cc98-8b23-abaa
      # ACL: rule 15 deny ip source 192.168.1.24 0
      - name: 主卧电视上网
        unique_id: sony_tv_master_bedroom_internet
        state: "{{ state_attr('sensor.sony_tv_internet_status', 'master_bedroom') == true }}"
        icon: "{{ 'mdi:television' if state_attr('sensor.sony_tv_internet_status', 'master_bedroom') == true else 'mdi:television-off' }}"
        turn_on:
          - service: shell_command.sony_tv_master_bedroom_internet_on
          - delay: "00:00:05"
          - service: homeassistant.update_entity
            target:
              entity_id: sensor.sony_tv_internet_status
        turn_off:
          - service: shell_command.sony_tv_master_bedroom_internet_off
          - delay: "00:00:05"
          - service: homeassistant.update_entity
            target:
              entity_id: sensor.sony_tv_internet_status

      # 客厅 Sony 电视
      # IP: 192.168.1.25
      # MAC: 88c9-e8d1-bcb0
      # ACL: rule 25 deny ip source 192.168.1.25 0
      - name: 客厅电视上网
        unique_id: sony_tv_living_room_internet
        state: "{{ state_attr('sensor.sony_tv_internet_status', 'living_room') == true }}"
        icon: "{{ 'mdi:television' if state_attr('sensor.sony_tv_internet_status', 'living_room') == true else 'mdi:television-off' }}"
        turn_on:
          - service: shell_command.sony_tv_living_room_internet_on
          - delay: "00:00:05"
          - service: homeassistant.update_entity
            target:
              entity_id: sensor.sony_tv_internet_status
        turn_off:
          - service: shell_command.sony_tv_living_room_internet_off
          - delay: "00:00:05"
          - service: homeassistant.update_entity
            target:
              entity_id: sensor.sony_tv_internet_status

      # 老人房 Sony 电视
      # IP: 192.168.1.26
      # MAC: cc98-8b36-afc7
      # ACL: rule 35 deny ip source 192.168.1.26 0
      - name: 老人房电视上网
        unique_id: sony_tv_elder_room_internet
        state: "{{ state_attr('sensor.sony_tv_internet_status', 'elder_room') == true }}"
        icon: "{{ 'mdi:television' if state_attr('sensor.sony_tv_internet_status', 'elder_room') == true else 'mdi:television-off' }}"
        turn_on:
          - service: shell_command.sony_tv_elder_room_internet_on
          - delay: "00:00:05"
          - service: homeassistant.update_entity
            target:
              entity_id: sensor.sony_tv_internet_status
        turn_off:
          - service: shell_command.sony_tv_elder_room_internet_off
          - delay: "00:00:05"
          - service: homeassistant.update_entity
            target:
              entity_id: sensor.sony_tv_internet_status

      # 书房 Sony 电视
      # IP: 192.168.1.27
      # MAC: 7026-05e6-0afd
      # ACL: rule 45 deny ip source 192.168.1.27 0
      - name: 书房电视上网
        unique_id: sony_tv_study_room_internet
        state: "{{ state_attr('sensor.sony_tv_internet_status', 'study_room') == true }}"
        icon: "{{ 'mdi:television' if state_attr('sensor.sony_tv_internet_status', 'study_room') == true else 'mdi:television-off' }}"
        turn_on:
          - service: shell_command.sony_tv_study_room_internet_on
          - delay: "00:00:05"
          - service: homeassistant.update_entity
            target:
              entity_id: sensor.sony_tv_internet_status
        turn_off:
          - service: shell_command.sony_tv_study_room_internet_off
          - delay: "00:00:05"
          - service: homeassistant.update_entity
            target:
              entity_id: sensor.sony_tv_internet_status
