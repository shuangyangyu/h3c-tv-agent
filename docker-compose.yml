services:
  h3c-tv-agent:
    build: ./agent
    container_name: h3c-tv-agent
    restart: unless-stopped
    ports:
      - "514:514/udp"
    env_file:
      - ./agent/.env
    environment:
      FEEDBACK_MODE: h3c_syslog
      SYSLOG_UDP_PORT: "514"
      DEVICES_CONFIG_PATH: /app/devices.yaml
    volumes:
      - ./agent/devices.yaml:/app/devices.yaml:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
