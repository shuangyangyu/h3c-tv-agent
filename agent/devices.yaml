    mac: cc98-8b23-abaa
  - key: 客厅电视
    ip: 192.168.1.25
    mac: 88c9-e8d1-bcb0
  - key: 老人房电视
    ip: 192.168.1.26
    mac: cc98-8b36-afc7
  - key: 书房电视
    ip: 192.168.1.27
    mac: 7026-05e6-0afd
  - key: 测试手机
